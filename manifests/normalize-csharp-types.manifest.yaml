# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Compare equivalent C# type spellings without rewriting collected artifacts
  or silently using an older Runner"
type: feature
created: "2026-08-01T08:32:14Z"
metadata:
  epic: resolve-csharp-validator-limitations
  runner_contract: 093-02-add-validator-type-comparison-hook
  tags:
    - csharp
    - type-normalization
    - validator-plugin
    - runner-hook
  priority: high
description: |
  Implement the first C# limitation child against Runner's additive
  `BaseValidator.types_match` hook. A new internal C# type canonicalizer
  compares source and manifest spellings while collectors and snapshots keep
  their original text.

  Pinned equivalences cover all C# keyword/CLR aliases, `global::` spellings,
  well-known BCL generic qualifications, nested generics, nullable value types,
  nullable annotations on known reference types, arrays and ranks, and tuple
  element names. Unknown qualified custom types remain namespace-sensitive,
  unknown `T?`/`Widget?` forms remain conservative without compiler evidence,
  and array rank/order and tuple position remain significant. Unsupported but
  lexically valid type syntax must compare deterministically and must not crash
  merely because it is outside the structured subset.

  Development re-enters the documented adjacent-checkout mode by restoring a
  local editable `[tool.uv.sources]` entry for `../maid-runner` and relocking.
  Hosted CI checks out the exact reviewed Runner contract commit beside this
  repository so the same relative source remains reproducible. Tagged release
  testing rejects the development-only source before dependency installation;
  it never substitutes unreleased source code into a publication run.
  The published dependency lower bound cannot honestly be raised until Runner
  assigns and publishes the first version containing contract 093-02. Until
  then, `CSharpValidator` must fail visibly when `BaseValidator.types_match` is
  absent; it may not run under an older engine that silently ignores the C#
  comparator. RELEASING retains the mandatory remove-local-source, raise-bound,
  relock, wheel-install, and discovery gates before any plugin publication.
temptations:
  - risk: "Do not replace raw FoundArtifact argument, return, property, or field type
      spellings with canonical strings."
    instead: "Canonicalize only inside types_match and prove collection plus snapshot
      output remains byte-for-byte source-shaped."
  - risk: "Do not equate arbitrary terminal custom type names across namespaces."
    instead: "Collapse only C# aliases and an explicit well-known BCL qualification
      table; keep Alpha.Widget distinct from Beta.Widget."
  - risk: "Do not treat every question-mark suffix identically without semantic evidence."
    instead: "Normalize known value nullable forms and erase annotations only for
      known reference forms; keep unknown/custom nullable forms conservative for the
      later Roslyn child."
  - risk: "Do not let the source package appear functional with a Runner that never
      calls the new hook."
    instead: "Restore the adjacent Runner development source and fail CSharpValidator
      initialization visibly when BaseValidator.types_match is unavailable."
  - risk: "Do not leave hosted CI on an unavailable or moving Runner source, or publish
      a wheel containing the adjacent editable source and old lower bound."
    instead: "Pin CI to the exact Runner 093-02 commit; for release, wait for the
      contract version, raise the lower bound, reject and remove tool.uv.sources,
      relock from indexes, and verify the installed wheel."
files:
  create:
    - path: src/maid_validator_csharp/_types.py
      artifacts:
        - kind: function
          name: normalize_csharp_type
          args:
            - name: type_str
              type: Optional[str]
          returns: Optional[str]
          description: "Canonicalizes supported C# type structure while preserving
            namespace-sensitive custom identities."
        - kind: function
          name: csharp_types_match
          args:
            - name: manifest_type
              type: Optional[str]
            - name: implementation_type
              type: Optional[str]
          returns: bool
          description: "Preserves Runner's unspecified/missing semantics and compares
            canonical C# type forms."
    - path: tests/test_type_normalization.py
      artifacts:
        - kind: test_function
          name: test_equivalent_csharp_type_spellings_match
          source_scenario: "Equivalent keyword/CLR, qualified BCL, generic, nullable,
            array, and tuple spellings are compared."
          actions:
            - type: api_call
              subject:
                function: CSharpValidator.types_match
          expected:
            behavior: "Every pinned equivalent pair matches without changing its input
              strings."
        - kind: test_function
          name: test_distinct_csharp_type_spellings_do_not_match
          source_scenario: "Different primitives, nullability, namespaces, generic
            arguments, array ranks, tuple positions, and arities are compared."
          actions:
            - type: api_call
              subject:
                function: CSharpValidator.types_match
          expected:
            behavior: "Each semantically distinct or syntax-ambiguous pair remains
              non-equivalent."
        - kind: test_function
          name: test_unspecified_manifest_type_preserves_runner_semantics
          source_scenario: "Manifest or implementation type values are absent or empty."
          actions:
            - type: api_call
              subject:
                function: csharp_types_match
          expected:
            behavior: "An unspecified manifest type accepts any implementation type;
              a specified manifest type rejects a missing implementation type."
        - kind: test_function
          name:
            test_unsupported_csharp_type_syntax_is_deterministic_and_non_crashing
          source_scenario: "Pointer and function-pointer spellings fall outside the
            structured canonical subset."
          actions:
            - type: api_call
              subject:
                function: normalize_csharp_type
          expected:
            behavior: "Canonicalization produces a deterministic conservative form
              and equal formatting variants match without an exception."
        - kind: test_function
          name: test_collected_and_snapshot_type_spellings_remain_raw
          source_scenario: "C# source uses fully qualified nested generic types in
            a public method."
          actions:
            - type: api_call
              subject:
                function: CSharpValidator.collect_implementation_artifacts
            - type: api_call
              subject:
                function: CSharpValidator.generate_snapshot
          expected:
            behavior: "Arguments and return types retain the exact source spellings
              even though equivalent aliases compare successfully."
        - kind: test_function
          name: test_validation_engine_accepts_nested_csharp_alias_equivalence
          source_scenario: "A manifest uses concise C# aliases while implementation
            source uses fully qualified nested BCL types."
          actions:
            - type: api_call
              subject:
                function: ValidationEngine.validate
          expected:
            behavior: "End-to-end implementation validation uses the registered C#
              hook and reports no E302 mismatch."
        - kind: test_function
          name: test_missing_runner_type_hook_fails_visibly
          source_scenario: "The installed BaseValidator lacks the required types_match
            contract."
          actions:
            - type: api_call
              subject:
                function: CSharpValidator
          expected:
            behavior: "Validator construction raises a targeted ImportError instead
              of silently running with Python-oriented type comparison."
  edit:
    - path: src/maid_validator_csharp/validator.py
      artifacts:
        - kind: class
          name: CSharpValidator
          bases:
            - BaseValidator
        - kind: method
          name: types_match
          of: CSharpValidator
          args:
            - name: manifest_type
              type: Optional[str]
            - name: implementation_type
              type: Optional[str]
          returns: bool
          description: "Delegates type equivalence to the C# canonicalizer and leaves
            raw collector output unchanged."
    - path: tests/test_release_readiness.py
      artifacts:
        - kind: test_function
          name: test_release_uses_only_published_maid_runner_sources
          source_scenario: "Development uses an adjacent Runner, but published package
            metadata and the release exit gate must remain index-based."
          actions:
            - type: api_call
              subject:
                function: tomllib.loads
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "Published dependency metadata remains index-based and release
              instructions require removing the local source and raising the lower
              bound before publication."
        - kind: test_function
          name: test_development_uses_adjacent_maid_runner_source
          source_scenario: "The repository needs unreleased Runner contract 093-02
            during development."
          actions:
            - type: api_call
              subject:
                function: tomllib.loads
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "Project and lock metadata select the exact adjacent editable
              Runner checkout without changing the published dependency declaration."
        - kind: test_function
          name: test_ci_and_publish_workflows_enforce_release_gates
          source_scenario: "Hosted CI needs unreleased Runner contract 093-02, while
            tagged publishing must use only released dependencies."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "CI checks out the exact reviewed Runner commit in the adjacent
              path and tagged release testing rejects development-only source metadata
              before dependency installation."
  scope:
    - path: pyproject.toml
      reason: "Restore the documented adjacent editable maid-runner source for development
        against unreleased contract 093-02."
    - path: uv.lock
      reason: "Relock the development environment to the adjacent Runner checkout
        while retaining published dependency metadata until the Runner release version
        exists."
    - path: README.md
      reason: "Replace the broad type-normalization limitation with the exact supported
        equivalences, conservative boundaries, and unreleased Runner requirement."
    - path: RELEASING.md
      reason: "Require the eventual Runner contract version lower bound, local-source
        removal, index relock, and installed-wheel verification before publishing
        this feature."
    - path: .github/workflows/ci.yml
      reason: "Provision the exact reviewed Runner contract commit beside the plugin
        so hosted matrix jobs can resolve the adjacent editable development source."
    - path: .github/workflows/publish.yml
      reason: "Fail tagged release testing visibly while development-only source
        metadata remains, rather than provisioning unreleased Runner code."
  read:
    - manifests/csharp-validator-plugin.manifest.yaml
    - manifests/prepare-pypi-release.manifest.yaml
    - manifests/drafts/resolve-csharp-validator-limitations.epic.yaml
    - src/maid_validator_csharp/_implementation.py
    - tests/test_implementation.py
validate:
  - uv run pytest tests/test_type_normalization.py tests/test_implementation.py
    tests/test_release_readiness.py -q
  - uv run maid validate manifests/normalize-csharp-types.manifest.yaml --mode
    behavioral --quiet
  - uv run maid validate manifests/normalize-csharp-types.manifest.yaml --mode
    schema --quiet
