schema: "2"
goal: Collect C# behavioral type, resolved method-owner, and object-initializer
  property references so exact manifest artifacts satisfy E200.
type: fix
created: "2026-07-22T10:21:59Z"
description: |
  Harden the C# plugin's public behavioral collector for ordinary test syntax used
  by Deckhand. Type annotations must cover interface identities, invocations on
  local variables must resolve to their declared and constructed owner types, and
  object initializer members must cover attributes on the initialized class.
  Keep this deliberately syntax-local: the validator should track bindings visible
  in the parsed test file, not attempt whole-program C# type or control-flow analysis.
temptations:
  - risk: "Do not weaken E200 or remove exact C# artifacts from consuming manifests."
    instead: "Emit exact FoundArtifact identities from direct C# syntax in behavioral
      tests."
  - risk: "Do not build a general C# compiler or control-flow engine for receiver
      resolution."
    instead: "Resolve only local declarations and object creations present in the
      parsed test file."
  - risk: "Do not label instance calls with the local variable name as the owner."
    instead: "Map the receiver to its declared and constructed type identities before
      emitting method references."
files:
  create:
    - path: tests/test_behavioral_identity.py
      artifacts:
        - kind: test_function
          name:
            test_type_annotations_cover_interface_identity_and_resolve_method_owner
        - kind: test_function
          name: test_var_object_creation_resolves_instance_method_owner
        - kind: test_function
          name: test_object_initializer_members_cover_class_attributes
        - kind: test_function
          name: test_typeof_and_nameof_cover_interface_method_identity
        - kind: test_function
          name: test_receiver_bindings_do_not_leak_between_test_methods
        - kind: test_function
          name: test_receiver_bindings_do_not_leak_between_lexical_blocks
        - kind: test_function
          name: test_nullable_and_qualified_generic_types_use_base_identity
        - kind: test_function
          name: test_qualified_nameof_uses_terminal_method_and_type_owner
        - kind: test_function
          name: test_target_typed_object_initializer_covers_attributes
  read:
    - src/maid_validator_csharp/_behavioral.py
    - manifests/csharp-validator-plugin.manifest.yaml
    - tests/test_behavioral.py
  scope:
    - path: src/maid_validator_csharp/_behavioral.py
      reason: Harden the existing contracted collector without changing its
        public signature.
validate:
  -   - uv
      - run
      - pytest
      - tests/test_behavioral_identity.py
      - tests/test_behavioral.py
      - -q
outcome:
  status: completed
  completed_at: "2026-07-22T11:15:00Z"
  summary: Hardened C# behavioral identity collection for interface/type references, lexically resolved instance methods, object initializer attributes, typeof, and nameof expressions.
  rationale: The Deckhand bug combined missing C# syntax identities with receiver names that could not match declared owners. Syntax-local binding resolution now emits exact declared and constructed owners while lexical isolation prevents false E200 evidence across methods or disjoint blocks.
  lessons:
    - lesson_type: design
      summary: Receiver identity collection must resolve the nearest visible declaration, not union same-named locals at file or method scope, because false owner candidates can incorrectly satisfy E200.
      tags: [csharp, identity, lexical-scope, e200]
      paths:
        - src/maid_validator_csharp/_behavioral.py
        - tests/test_behavioral_identity.py
    - lesson_type: validation
      summary: End-to-end C# behavioral validation also depends on MAID Runner recognizing *Tests.cs filenames; direct plugin collection alone is insufficient evidence.
      tags: [csharp, plugin, test-discovery]
      paths:
        - tests/test_behavioral_identity.py
  review_notes:
    - source: independent-review-round-1
      severity: needs-changes
      summary: Found global binding leakage, incomplete type normalization, qualified nameof selection, and target-typed initializer gaps; all received locked regressions and fixes.
    - source: independent-review-round-2
      severity: needs-changes
      summary: Found same-name receiver leakage across disjoint lexical blocks; nearest-visible-declaration resolution and a negative regression fixed it.
    - source: independent-review-round-3
      severity: ready
      summary: No remaining correctness, false-E200, scope, regression, or MAID contract findings.
  validation:
    - command: [uv, run, pytest, -q]
      status: passed
      summary: All 54 plugin tests passed in independent final review.
    - command: [uv, run, ruff, check, src/, tests/]
      status: passed
      summary: Lint passed.
    - command: [uv, run, black, --check, src/, tests/]
      status: passed
      summary: Formatting check passed.
    - command: [uv, run, maid, verify, --summary, --require-plan-lock, --require-red-evidence, --since, HEAD]
      status: passed
      summary: All nine verification stages passed.
